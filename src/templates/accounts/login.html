{% extends "base.html" %}

{% block title %}Log in · Learning Companion{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md">
    {% include "components/_page_header.html" with heading="Log in" %}
    <div class="card card-border bg-base-100">
      <div class="card-body">
        <form method="post" action="{% url 'accounts:login' %}">
          {% csrf_token %}
          {{ form }}
          {# next is already validated by LoginView: "" unless it is a same-site URL. #}
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary mt-6 w-full">Log in</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
