{% extends "base.html" %}

{% block title %}Sign up · Learning Companion{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md">
    {% include "components/_page_header.html" with heading="Sign up" %}
    <div class="card card-border bg-base-100">
      <div class="card-body">
        {# Only method and action on this form: the sign-up tests pin its attributes. #}
        <form method="post" action="{% url 'accounts:signup' %}">
          {% csrf_token %}
          {{ form }}
          <button type="submit" class="btn btn-primary mt-6 w-full">Sign up</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
