{% extends "base.html" %}

{% block title %}Sign up · Learning Companion{% endblock %}

{% block content %}
  <h1 class="text-2xl font-bold">Sign up</h1>
  <form method="post" action="{% url 'accounts:signup' %}">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Sign up</button>
  </form>
{% endblock %}
