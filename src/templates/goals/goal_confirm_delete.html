{% extends "base.html" %}

{% block content %}
  <h1 class="text-2xl font-bold">Delete “{{ object.title }}”?</h1>
  <p class="mt-2 text-slate-500">This can't be undone.</p>
  <form method="post" action="{% url 'goals:delete' object.pk %}" class="mt-6">
    {% csrf_token %}
    <button type="submit" class="font-medium text-red-700">Delete</button>
  </form>
  <a href="{{ object.get_absolute_url }}" class="mt-4 inline-block hover:underline">Cancel</a>
{% endblock %}
