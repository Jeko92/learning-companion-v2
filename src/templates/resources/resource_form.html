{% extends "base.html" %}

{% block title %}Attach a resource · Learning Companion{% endblock %}

{% block content %}
  <h1 class="text-2xl font-bold">Attach a resource</h1>
  <p class="mt-2 text-sm text-slate-500">For {{ goal.title }}</p>
  <form method="post" action="{% url 'resources:create' goal.pk %}" class="mt-6">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Save</button>
  </form>
  <a href="{{ goal.get_absolute_url }}" class="mt-4 inline-block hover:underline">Cancel</a>
{% endblock %}
