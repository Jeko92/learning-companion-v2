{% extends "base.html" %}

{% block content %}
  {# Shared by create and edit: `object` is only set when editing. #}
  <h1 class="text-2xl font-bold">{% if object %}Edit session{% else %}New session{% endif %}</h1>
  <p class="mt-2 text-sm text-slate-500">For {{ goal.title }}</p>
  <form method="post" action="{% if object %}{% url 'learning_sessions:edit' object.pk %}{% else %}{% url 'learning_sessions:create' goal.pk %}{% endif %}" class="mt-6">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Save</button>
  </form>
  <a href="{{ goal.get_absolute_url }}" class="mt-4 inline-block hover:underline">Cancel</a>
{% endblock %}
