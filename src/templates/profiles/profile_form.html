{% extends "base.html" %}

{% block title %}Edit your profile · Learning Companion{% endblock %}

{% block content %}
  <div class="mx-auto max-w-2xl">
    {% include "components/_page_header.html" with heading="Edit your profile" %}
    <div class="card card-border bg-base-100">
      <div class="card-body">
        <form method="post" action="{% url 'profiles:edit' profile.pk %}">
          {% csrf_token %}
          {{ form }}
          <div class="mt-6 flex justify-end">
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
