{% extends "base.html" %}

{% block title %}Edit your profile · Learning Companion{% endblock %}

{% block content %}
  <h1 class="text-2xl font-bold">Edit your profile</h1>
  <form method="post" action="{% url 'profiles:edit' profile.pk %}">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Save</button>
  </form>
{% endblock %}
